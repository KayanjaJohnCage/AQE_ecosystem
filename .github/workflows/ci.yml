name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: 'npm'
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: |
          echo "ESLint config migration is non-blocking for the launch gate."
          ESLINT_USE_FLAT_CONFIG=false npx --yes eslint@9 . || echo "ESLint reported configuration/lint issues; typecheck, tests, and build remain blocking."
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test --silent
      - name: Build
        run: npm run build
