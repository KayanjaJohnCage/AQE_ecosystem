name: AQE Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check
      NEXT_PUBLIC_APP_ENV: production
      AQE_MANAGER_SESSION_SECRET: build-check-only-secret
      CRON_SECRET: build-check-only-cron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
